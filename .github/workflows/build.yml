name: Build

on:
  push:
    branches:
      - '*/*'
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # `npm ci` and not `npm install`: it FAILS on a lockfile that disagrees with
        # package.json, which is the only guard against the drift that shipped through
        # three releases unnoticed (see CLAUDE.md → "An out-of-sync lockfile is invisible
        # to `npm install`"). Node 20 here means npm 10 — the strict generation.
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./build

  build-windows:
    name: Build (Windows, non-blocking)
    runs-on: windows-latest
    # Visibility only until native Windows support is complete: this job is
    # expected to fail on the lt dev suites (/bin/sh, lsof, process groups).
    # Flip to blocking once it is green.
    continue-on-error: true
    timeout-minutes: 45
    # Every step after checkout runs with `!cancelled()`, so one run shows
    # everything that is red on Windows instead of stopping at the first failure.
    steps:
      - name: Reproduce the Git for Windows default (CRLF checkout)
        # Proves .gitattributes keeps the tree LF on a stock Windows machine.
        run: git config --global core.autocrlf true
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Assert LF checkout
        # Checks the working tree itself rather than trusting autocrlf: a script,
        # hook or shebang file checked out with CRLF breaks under Git Bash.
        # Only files .gitattributes pins to CRLF (*.cmd, *.bat) may carry it.
        shell: bash
        run: |
          crlf=$(git ls-files --eol | grep 'w/crlf' | grep -v 'eol=crlf' || true)
          if [ -n "$crlf" ]; then
            echo "::error::CRLF in the working tree despite .gitattributes"
            echo "$crlf"
            exit 1
          fi
      - name: Use Node.js 20
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: npm ci
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Compile
        if: ${{ !cancelled() }}
        run: npm run compile
      - name: Copy templates
        if: ${{ !cancelled() }}
        run: npm run copy-templates
      - name: CLI smoke test
        if: ${{ !cancelled() }}
        run: node bin/lt --version
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test
