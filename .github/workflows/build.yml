name: Build

on:
  push:
    branches:
      - '*/*'
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # `npm ci` and not `npm install`: it FAILS on a lockfile that disagrees with
        # package.json, which is the only guard against the drift that shipped through
        # three releases unnoticed (see CLAUDE.md → "An out-of-sync lockfile is invisible
        # to `npm install`"). Node 20 here means npm 10 — the strict generation.
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./build
